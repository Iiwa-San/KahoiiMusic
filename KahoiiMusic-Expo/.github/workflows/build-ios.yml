name: Build iOS IPA (React Native Expo)

on:
  push:
    branches: [ "main", "master", "ExpoApp", "IOSApp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Select Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          npm ci

      - name: Expo Prebuild (Generate Native iOS Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS App with Xcode
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/KahoiiMusic.xcworkspace \
            -scheme KahoiiMusic \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build_device.log || {
              echo "### ❌ Build failed" >> $GITHUB_STEP_SUMMARY
              tail -n 100 build_device.log >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package .ipa File
        run: |
          APP_PATH=$(find build-device/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "KahoiiMusic.ipa" Payload
          echo "Created IPA successfully: KahoiiMusic.ipa"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-React-Native-IPA
          path: KahoiiMusic.ipa
          retention-days: 14

