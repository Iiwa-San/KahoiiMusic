name: Build iOS App (IPA & Simulator)

on:
  push:
    branches: [ "IOSApp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # --- 1. BUILD IPA CHO IPHONE THẬT (ARM64 RELEASE) ---
      - name: Build for iOS Device (Release)
        run: |
          xcodebuild build \
            -project KahoiiMusic.xcodeproj \
            -scheme KahoiiMusic \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa File
        run: |
          APP_PATH=$(find build-device/Build/Products/Release-iphoneos -name "KahoiiMusic.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::KahoiiMusic.app for iOS Device not found!"
            exit 1
          fi
          echo "Found Device app at: $APP_PATH"
          # Ensure App Icon is copied directly into app bundle root
          cp Resources/AppIcon.png "$APP_PATH/AppIcon.png"
          cp Resources/AppIcon.png "$APP_PATH/AppIcon60x60@2x.png"
          cp Resources/AppIcon.png "$APP_PATH/AppIcon60x60@3x.png"
          cp Resources/AppIcon.png "$APP_PATH/AppIcon76x76@2x~ipad.png"
          # Convert Info.plist to human-readable XML format (prevents Windows Sideloadly bplist corruption)
          plutil -convert xml1 "$APP_PATH/Info.plist"
          # Pre-sign with ad-hoc signature so _CodeSignature is fully structured
          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "$GITHUB_WORKSPACE/KahoiiMusic.ipa" Payload
          echo "Created IPA: $GITHUB_WORKSPACE/KahoiiMusic.ipa"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-IPA
          path: KahoiiMusic.ipa
          retention-days: 14

      # --- 2. BUILD CHO SIMULATOR / APPETIZE.IO ---
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project KahoiiMusic.xcodeproj \
            -scheme KahoiiMusic \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Prepare Appetize Bundle (Ensure .app folder is preserved at zip root)
        run: |
          APP_PATH=$(find build-simulator/Build/Products/Debug-iphonesimulator -name "KahoiiMusic.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::KahoiiMusic.app for Simulator not found!"
            exit 1
          fi
          echo "Found Simulator app at: $APP_PATH"
          # Ensure App Icon is copied directly into app bundle root
          cp Resources/AppIcon.png "$APP_PATH/AppIcon.png"
          cp Resources/AppIcon.png "$APP_PATH/AppIcon60x60@2x.png"
          cp Resources/AppIcon.png "$APP_PATH/AppIcon60x60@3x.png"
          # Convert Info.plist to human-readable XML format
          plutil -convert xml1 "$APP_PATH/Info.plist"
          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p appetize_bundle
          cp -r "$APP_PATH" appetize_bundle/
          cd appetize_bundle
          zip -r -y "$GITHUB_WORKSPACE/KahoiiMusic-Appetize.zip" KahoiiMusic.app
          echo "Zip contents verification:"
          unzip -l "$GITHUB_WORKSPACE/KahoiiMusic-Appetize.zip" | head -n 15

      - name: Upload Simulator Artifact (With KahoiiMusic.app folder)
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-Simulator
          path: appetize_bundle/
          retention-days: 14

      # --- 3. CREATE DIRECT DOWNLOAD RELEASE ON GITHUB ---
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "latest-ios"
          name: "KahoiiMusic iOS Latest Build"
          body: |
            ### 🎵 KahoiiMusic iOS App Build
            - **KahoiiMusic.ipa**: File cài đặt trực tiếp lên iPhone/iPad (qua Sideloadly, AltStore, TrollStore).
            - **KahoiiMusic-Appetize.zip**: File chuẩn để test trên web [Appetize.io/upload](https://appetize.io/upload) (đã có thư mục `KahoiiMusic.app` chuẩn bên trong).
          files: |
            KahoiiMusic.ipa
            KahoiiMusic-Appetize.zip

      - name: Summary
        run: |
          echo "### 🎉 Đã tạo thành công cả file IPA và Simulator!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic.ipa**: Cài đặt trực tiếp lên iPhone/iPad." >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic-Appetize.zip**: Dùng để test trên trình duyệt web qua Appetize.io." >> $GITHUB_STEP_SUMMARY
