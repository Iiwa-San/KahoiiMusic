name: Build iOS App (IPA & Simulator)

on:
  push:
    branches: [ "IOSApp" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      # --- 1. BUILD IPA CHO IPHONE THẬT (ARM64 RELEASE) ---
      - name: Build for iOS Device (Release)
        run: |
          xcodebuild build \
            -project KahoiiMusic.xcodeproj \
            -scheme KahoiiMusic \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa File
        run: |
          APP_PATH=$(find build-device/Build/Products/Release-iphoneos -name "KahoiiMusic.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::KahoiiMusic.app for iOS Device not found!"
            exit 1
          fi
          echo "Found Device app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "$GITHUB_WORKSPACE/KahoiiMusic.ipa" Payload
          echo "Created IPA: $GITHUB_WORKSPACE/KahoiiMusic.ipa"

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-IPA
          path: KahoiiMusic.ipa
          retention-days: 14

      # --- 2. BUILD CHO SIMULATOR / APPETIZE.IO ---
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project KahoiiMusic.xcodeproj \
            -scheme KahoiiMusic \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Simulator App (.zip for Appetize.io)
        run: |
          APP_PATH=$(find build-simulator/Build/Products/Debug-iphonesimulator -name "KahoiiMusic.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::KahoiiMusic.app for Simulator not found!"
            exit 1
          fi
          echo "Found Simulator app at: $APP_PATH"
          cd $(dirname "$APP_PATH")
          zip -r -y "$GITHUB_WORKSPACE/KahoiiMusic-Simulator.zip" KahoiiMusic.app

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-Simulator
          path: KahoiiMusic-Simulator.zip
          retention-days: 14

      - name: Summary
        run: |
          echo "### 🎉 Đã tạo thành công cả file IPA và Simulator!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic-IPA** (.ipa): Dùng để cài trực tiếp vào iPhone/iPad qua Sideloadly, AltStore, TrollStore." >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic-Simulator** (.zip): Dùng để test trên trình duyệt web qua Appetize.io." >> $GITHUB_STEP_SUMMARY
