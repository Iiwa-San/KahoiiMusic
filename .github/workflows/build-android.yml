name: Build Android App (APK)

on:
  push:
    branches: [ "AndroidApp" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Release Keystore
        run: |
          echo "=== Verifying persistent release keystore ==="
          keytool -list -v -keystore app/kahoii.p12 -storepass kahoii123456

      - name: Build Android Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || {
            echo "### ❌ Build Android Failed" >> $GITHUB_STEP_SUMMARY
            grep -E "e: " build.log | head -n 10 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 20 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Build-Log
          path: build.log

      - name: Prepare APK Asset
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" KahoiiMusic.apk
          zip -y KahoiiMusic-Appetize.zip KahoiiMusic.apk
          ls -lh KahoiiMusic.apk KahoiiMusic-Appetize.zip

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-Android-APK
          path: KahoiiMusic.apk
          retention-days: 14

      - name: Upload Appetize Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KahoiiMusic-Android-Appetize
          path: KahoiiMusic-Appetize.zip
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "latest-android"
          name: "KahoiiMusic Android Latest Build"
          body: |
            ### 🤖 KahoiiMusic Android App Build
            - **KahoiiMusic.apk**: File cài đặt trực tiếp lên điện thoại / máy tính bảng Android (hỗ trợ Android 7.0 trở lên).
            - **KahoiiMusic-Appetize.zip**: File nén chứa APK dùng để upload test trên Appetize.io.
          files: |
            KahoiiMusic.apk
            KahoiiMusic-Appetize.zip
            version.json

      - name: Summary
        run: |
          echo "### 🎉 Đã tạo thành công file KahoiiMusic.apk và KahoiiMusic-Appetize.zip!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic.apk**: Cài đặt trực tiếp lên điện thoại / máy tính bảng Android." >> $GITHUB_STEP_SUMMARY
          echo "- **KahoiiMusic-Appetize.zip**: Dùng để test trên trình duyệt web qua Appetize.io." >> $GITHUB_STEP_SUMMARY
